#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Oleme kuva praeguse paigutuse salvestanud teie vaikevaateks <b>Minu kavandamistahvel</b>.<br>Kui vajate eri \u00FClesannete jaoks erinevaid paigutusi, saate luua mitu vaadet.<br>T\u00E4iendavate muudatuste tegemiseks reguleerige kuva soovitud viisil ja seej\u00E4rel salvestage see asjakohasesse vaatesse.<br>Kui soovite, et kolleegid saaksid teie loodud vaadet kasutada, kl\u00F5psake selle salvestamisel valikut \u201EAvalik\u201C.<br><br>Vaatesse salvestatavate s\u00E4tete n\u00E4ited<ul><li>M\u00E4\u00E4rake, kas kuvatakse ainult tellimuste diagramm v\u00F5i nii tellimuste kui ka ressursside diagramm.</li><li>Reguleerige iga veeru ruumi (lohistage veeru servad soovitud laiuseni).</li><li>Enamiku veergude puhul saab lisaks m\u00E4\u00E4rata, kas soovite need sortida t\u00F5usvas v\u00F5i laskuvas j\u00E4rjestuses.</li></ul></p>

