#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>\u012Era\u0161\u0117me dabartin\u012F j\u016Bs\u0173 ekrano i\u0161d\u0117stym\u0105 kaip numatyt\u0105j\u012F ekrano rakurs\u0105<br>Mano planavimo skydas</b>.<br>Jei jums reikia skirtingo i\u0161d\u0117stymo skirtingoms u\u017Eduotis, galite sukurti kelis rakursus.<br>Jei riekia atlikti daugiau pakeitim\u0173, pritaikykite ekran\u0105, kaip reikia, ir \u012Fra\u0161ykite atitinkam\u0105 rakurs\u0105.<br>Jei norite, kad j\u016Bs\u0173 bendradarbiai gal\u0117t\u0173 naudoti j\u016Bs\u0173 sukurt\u0105 rakurs\u0105, spustel\u0117kite \u201EVie\u0161as\u201C, kai j\u012F \u012Fra\u0161ote.<br><br>Parametr\u0173, kuriuos galite saugoti rakurse, pavyzd\u017Eiai\:<ul><li>Rinkit\u0117s tik tarp rodom\u0173 u\u017Esakym\u0173 schemos arba u\u017Esakym\u0173 ir i\u0161tekli\u0173 schem\u0173.</li><li>Koreguokite kiekvienam stulpeliui skirt\u0105 erdv\u0119 (traukite stulpelio \u0161onus, kol pasieksite pageidaujam\u0105 plot\u012F).</li><li>Daugumai stulpeli\u0173 galite pasirinkti, ar norite r\u016B\u0161iuoti stulpelio reik\u0161mes did\u0117jimo ar ma\u017E\u0117jimo tvarka.</li></ul></p>

