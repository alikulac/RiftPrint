#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>N\u00F3s salvamos o layout atual da sua tela como a sua vis\u00E3o default <b>Meu painel de planejamento</b>.<br>Se voc\u00EA precisar de layouts diferentes para tarefas diferentes, pode criar v\u00E1rias vis\u00F5es.<br>Para efetuar mais modifica\u00E7\u00F5es, adapte a tela conforme necess\u00E1rio e, em seguida, salve a vis\u00E3o apropriada.<br>Se quiser que seus colegas usem uma vis\u00E3o que voc\u00EA criou, clique em 'P\u00FAblico' ao salvar a vis\u00E3o.<br><br>Exemplos de configura\u00E7\u00F5es que voc\u00EA pode armazenar em uma vis\u00E3o\:<ul><li>Escolha entre exibir s\u00F3 o diagrama Ordens ou os dois diagramas Ordens e Recursos.</li><li>Ajuste o espa\u00E7o dado para cada coluna (arraste os lados da coluna at\u00E9 \u00E0 largura que voc\u00EA pretende).</li><li>Na maioria das colunas, voc\u00EA pode tamb\u00E9m escolher se quer ordenar os valores da coluna em ordena\u00E7\u00E3o decrescente ou ascendente.</li></ul></p>

