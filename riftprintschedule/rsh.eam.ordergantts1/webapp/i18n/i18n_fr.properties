#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>La mise en forme actuelle de votre \u00E9cran a \u00E9t\u00E9 sauvegard\u00E9e comme votre vue par d\u00E9faut <b>Mon tableau d'ordonnancement</b>.<br>Si vous avez besoin de mises en forme diff\u00E9rentes selon vos t\u00E2ches, vous pouvez cr\u00E9er plusieurs vues.<br>Pour apporter d'autres modifications, ajustez l'\u00E9cran selon vos besoins puis sauvegardez la vue ad\u00E9quate.<br>Si vous voulez que vos coll\u00E8gues puissent utiliser une vue que vous avez cr\u00E9\u00E9e, cliquez sur Public lorsque vous la sauvegardez.<br><br>Exemples d'options que vous pouvez enregistrer dans une vue\u00A0\:<ul><li>Choisissez d'afficher uniquement le graphique des ordres ou les graphiques des ordres et des ressources.</li><li>Ajustez l'espace donn\u00E9 \u00E0 chaque colonne (tirez sur les bords de la colonne pour obtenir la largeur voulue).</li><li>Pour la plupart des colonnes, vous pouvez \u00E9galement choisir de trier les valeurs de colonne par ordre croissant ou d\u00E9croissant.</li></ul></p>

