#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Aktu\u00E1lne rozlo\u017Eenie va\u0161ej obrazovky sme ulo\u017Eili ako va\u0161e predvolen\u00E9 zobrazenie . <b>Moja pl\u00E1novacia tabu\u013Ea</b><br>Ak potrebujete r\u00F4zne rozlo\u017Eenia pre r\u00F4zne \u00FAlohy, m\u00F4\u017Eete vytvori\u0165 viac zobrazen\u00ED.<br>Ak chcete vykona\u0165 \u010Fal\u0161ie zmeny, prisp\u00F4sobte obrazovku pod\u013Ea potreby a potom ju ulo\u017Ete do pr\u00EDslu\u0161n\u00E9ho zobrazenia.<br>Ak chcete, aby va\u0161i kolegovia mohli pou\u017E\u00EDva\u0165 zobrazenie, ktor\u00E9 ste vytvorili, pri ulo\u017Een\u00ED kliknite na \u201EVerejn\u00E9\u201C.<br><br>Pr\u00EDklady nastaven\u00ED, ktor\u00E9 m\u00F4\u017Eete ulo\u017Ei\u0165 v zobrazen\u00ED\:<ul><li>Vyberte si medzi zobrazen\u00EDm grafu z\u00E1kaziek alebo grafov z\u00E1kaziek aj zdrojov. </li><li>Upravte priestor pre ka\u017Ed\u00FD st\u013Apec (potiahnite strany st\u013Apca na po\u017Eadovan\u00FA \u0161\u00EDrku).</li><li>Pri v\u00E4\u010D\u0161ine st\u013Apcov si tie\u017E m\u00F4\u017Eete vybra\u0165, \u010Di chcete hodnoty st\u013Apcov zoradi\u0165 vzostupne alebo zostupne.</li></ul></p>

