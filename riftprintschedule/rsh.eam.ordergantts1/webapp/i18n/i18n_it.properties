#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>L\u2019attuale layout della tua videata \u00E8 stato salvato come view standard <b>La mia tavola di pianificazione</b>.<br>Se hai bisogno di layout diversi per task diversi, puoi creare pi\u00F9 view.<br>Per apportare ulteriori modifiche, adatta la videata come richiesto e poi salva nella view appropriata.<br>Se vuoi che i tuoi colleghi possano utilizzare una view che hai creato, fai clic su Pubblico quando la salvi.<br><br>Esempi di impostazioni che puoi archiviare in una view\:<ul><li>Scegli tra la visualizzazione del solo grafico Ordini o entrambi i grafici Ordini e Risorse.</li><li>Adatta lo spazio assegnato ad ogni colonna (tira i lati della colonna per ottenere la larghezza desiderata).</li><li>Per la maggior parte delle colonne, \u00E8 possibile scegliere anche se classificare i valori colonna in ordine crescente o decrescente.</li></ul></p>

