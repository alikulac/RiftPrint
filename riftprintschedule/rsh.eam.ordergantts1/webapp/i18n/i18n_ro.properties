#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Am salvat layoutul curent al ecranului dvs. ca imagine implicit\u0103 <b>Tabloul meu de programare</b>.<br>Dac\u0103 ave\u021Bi nevoie de layouturi diferite pentru diferite sarcini, pute\u021Bi crea mai multe imagini.<br>Pentru a face modific\u0103ri ulterioare, adapta\u021Bi ecranul dup\u0103 caz \u0219i apoi salva\u021Bi la imaginea corespunz\u0103toare.<br>Dac\u0103 dori\u021Bi ca \u0219i colegii dvs. s\u0103 poat\u0103 utiliza o imagine pe care a\u021Bi creat-o, face\u021Bi click pe 'Public' atunci c\u00E2nd o salva\u021Bi.<br><br>Exemple de set\u0103ri pe care le pute\u021Bi arhiva \u00EEntr-o imagine\:<ul><li>Alege\u021Bi \u00EEntre a afi\u0219a doar diagrama Comenzi sau ambele diagrame Comenzi \u0219i Resurse.</li><li>Ajusta\u021Bi spa\u021Biul indicat \u00EEn fiecare coloan\u0103 (trage\u021Bi p\u0103r\u021Bile laterale ale coloanei la l\u0103\u021Bimea dorit\u0103).</li><li>Pentru majoritatea coloanelor, pute\u021Bi alege, de asemenea, dac\u0103 dori\u021Bi s\u0103 sorta\u021Bi valorile coloanei \u00EEn ordine ascendent\u0103 sau descendent\u0103.</li></ul></p>

