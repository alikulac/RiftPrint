#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>We hebben de huidige layout van uw scherm als standaardviewt <b>Mijn onderhoudsplanningsbord</b> opgeslagen.<br>Als u verschillende layouts nodig hebt voor verschillende taken, kunt u meerdere views cre\u00EBren.<br>Voor verdere wijzigingen past u het scherm aan uw behoeften aan en slaat de relevante view op.<br>Als u wilt dat uw collega's een view kunnen gebruiken die u hebt gecre\u00EBerd, klikt u op Openbaar als u deze opslaat.<br><br>Voorbeeld van instellingen die u in een schermvariant kunt opslaan\:<ul><li>Kies tussen de weergave van alleen orderdiagram of order- en resourcediagrammen.</li><li>Pas de ruimte aan voor elke kolom (sleep de zijden van de kolom naar de gewenste breedte).</li><li>Voor de meeste kolommen kunt u ook kiezen of u de kolomwaarden op- of aflopende wilt sorteren.</li></ul></p>

