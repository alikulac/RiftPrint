#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Vi har gemt det aktuelle layout for din sk\u00E6rm som din standardview.<b>Min planl\u00E6gningstavle</b>.<br>Hvis du har brug for andre layouts til andre opgaver, kan du oprette flere views.<br>For at foretage yderligere \u00E6ndringer skal du tilpasse sk\u00E6rmen efter behov og derefter gemme \u00E6ndringerne i det passende view.<br>Hvis du gerne vil have, at dine kolleger kan bruge et view, som du har oprettet, skal du klikke p\u00E5 Offentlig, n\u00E5r du gemmer den.<br><br>Eksempler p\u00E5 indstillinger, som du kan gemme i et view\:<ul><li>V\u00E6lg mellem kun at vise ordrediagram, eller b\u00E5de ordre- og ressourcediagrammer.</li><li>Tilpas den plads, der er til hver kolonne (tr\u00E6k kolonnens sider til den bredde, du \u00F8nsker).</li><li>Ved de fleste kolonner kan du ogs\u00E5 v\u00E6lge, om du vil sortere kolonnev\u00E6rdierne i stigende eller faldende r\u00E6kkef\u00F8lge.</li></ul></p>

