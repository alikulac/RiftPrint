#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Olemme tallentaneet n\u00E4ytt\u00F6si nykyisen asettelun oletusn\u00E4kym\u00E4ksi <b>Oma suunnittelutaulu</b>.<br> Jos tarvitset erilaisia asetteluja eri teht\u00E4vi\u00E4 varten, voit luoda useita n\u00E4kymi\u00E4.<br>Jos haluat tehd\u00E4 lis\u00E4muutoksia, mukauta n\u00E4ytt\u00F6\u00E4 tarpeen mukaan ja tallenna sitten sopivaan n\u00E4kym\u00E4\u00E4n. <br>Jos haluat, ett\u00E4 kollegasi voivat k\u00E4ytt\u00E4\u00E4 luomaasi n\u00E4kym\u00E4\u00E4, napsauta Julkinen, kun tallennat sen.<br><br>Esimerkkej\u00E4 asetuksista, jotka voit tallentaa n\u00E4kym\u00E4\u00E4n\:<ul><li>Valitse, n\u00E4ytet\u00E4\u00E4nk\u00F6 vain tilauskaavio vai sek\u00E4 tilaus- ett\u00E4 resurssikaaviot.</li><li>S\u00E4\u00E4d\u00E4 kullekin sarakkeelle annettavaa tilaa (ved\u00E4 sarakkeen sivut haluamaasi leveyteen).</li> <li>Useimmissa sarakkeissa voit my\u00F6s valita, haluatko lajitella sarakearvot nousevaan vai laskevaan j\u00E4rjestykseen.</li></ul></p>

