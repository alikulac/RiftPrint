#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>M\u0113s esam saglab\u0101ju\u0161i j\u016Bsu pa\u0161reiz\u0113jo ekr\u0101na izk\u0101rtojumu k\u0101 j\u016Bsu noklus\u0113juma skatu <b>Mans grafika pl\u0101no\u0161anas panelis</b>.<br>Ja jums da\u017E\u0101diem uzdevumiem ir nepiecie\u0161ami da\u017E\u0101di izk\u0101rtojumi, varat izveidot vair\u0101kus skatus.<br>Lai turpin\u0101tu veikt izmai\u0146as, piel\u0101gojiet ekr\u0101nu p\u0113c nepiecie\u0161am\u012Bbas, p\u0113c tam saglab\u0101jiet atbilsto\u0161\u0101 skat\u0101.<br>Ja v\u0113laties, lai j\u016Bsu kol\u0113\u0123i var\u0113tu izmantot izveidoto skatu, noklik\u0161\u0137iniet uz \u201CPublisks\u201D, kad to saglab\u0101jat.<br><br>Iestat\u012Bjumu piem\u0113ri, ko varat glab\u0101t skat\u0101\:<ul><li>Izv\u0113lieties, vai r\u0101d\u012Bt tikai pas\u016Bt\u012Bjumu diagrammu vai abas \u2013 pas\u016Bt\u012Bjumu un resursu diagrammu.</li><li>Kori\u0123\u0113jiet katrai kolonnai atv\u0113l\u0113to vietu (velciet kolonnas malas l\u012Bdz vajadz\u012Bgam platumam).</li><li>Vair\u0101kumam kolonnu varat ar\u012B izv\u0113l\u0113ties, vai k\u0101rtot kolonnu v\u0113rt\u012Bbas augo\u0161\u0101 vai dilsto\u0161\u0101 sec\u012Bb\u0101.</li></ul></p>

