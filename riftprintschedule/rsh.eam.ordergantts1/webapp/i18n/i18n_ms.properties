#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Kami telah menyimpan tataletak semasa skrin anda sebagai paparan lalai anda <br>Papan Penjadualan Saya</b>.<br>Jika anda memerlukan tataletak yang berbeza untuk tugas berbeza, anda boleh mencipta pelbagai paparan.<<br>Untuk membuat perubahan selanjutnya, sesuaikan skrin seperti yang diperlukan dan kemudian simpan pada paparan yang sesuai.<br>Jika anda ingin rakan sekerja anda boleh menggunakan paparan yang anda cipta, klik pada 'Umum' apabila anda menyimpannya.<br><br>Contoh tetapan yang boleh anda simpan dalam paparan\:<ul><li>Pilih antara memaparkan carta Pesanan sahaja atau kedua-dua carta Pesanan dan Sumber.</li><li>Laraskan ruang yang diberikan kepada setiap lajur (Tarik sebelah lajur mengikut lebar yang anda inginkan).</li><li>Untuk maksimum lajur, anda juga boleh memilih sama ada anda ingin mengisih nilai lajur dalam urutan menaik atau menurun.</li></ul></p>

