#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Vi har sparat den aktuella sk\u00E4rmlayouten som din standardvy <b>Min planeringstavla</b>.<br>Om du beh\u00F6ver olika layouter f\u00F6r olika uppgifter kan du skapa flera vyer.<br>G\u00F6r ytterligare \u00E4ndringar genom att anpassa sk\u00E4rmen efter behov och sedan spara l\u00E4mplig vy.<br>Om du vill att dina kollegor ska kunna anv\u00E4nda en vy som du har skapat klickar du p\u00E5 "Offentlig" n\u00E4r du sparar den.<br><br>Exempel p\u00E5 inst\u00E4llningar som du kan spara i en vy\:<ul><li>V\u00E4lj mellan att visa endast orderdiagram eller b\u00E5de orderdiagram och resursdiagram.</li><li>Justera utrymmet f\u00F6r varje kolumn (dra i sidorna av kolumnen f\u00F6r att f\u00E5 den bredd du vill ha).</li><li>F\u00F6r de flesta kolumner kan du \u00E4ven v\u00E4lja om du vill sortera kolumnv\u00E4rden i stigande eller fallande ordning.</li></ul></p>

