#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Snimili smo trenutni layout va\u0161eg ekrana kao preddefinirani pogled <b>Moja plo\u010Da rasporeda</b>.<br>Ako su vam potrebni razli\u010Diti layouti za razli\u010Dite zadatke, mo\u017Eete kreirati vi\u0161estruke poglede.<br>Za daljnje promjene prilagodite ekran po potrebi i zatim snimite u odgovaraju\u0107i pogled.<br>Ako \u017Eelite da va\u0161e kolege mogu koristiti pogled koji ste kreirali, kliknite 'Javno' nakon snimanja.<br><br>Primjeri postava koje mo\u017Eete pohraniti u pogledu\:<ul><li>izaberite izme\u0111u prikaza samo dijagrama naloga ili dijagrama naloga i resursa.</li><li>Prilagodite prostor svakog stupca (povucite stranice stupca na \u017Eeljenu \u0161irinu).</li><li>Za ve\u0107inu stupaca tako\u0111er mo\u017Eete izabrati \u017Eelite li sortirati vrijednosti stupaca uzlaznim ili silaznim redoslijedom.</li></ul></p>

