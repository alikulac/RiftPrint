#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Vi har lagret det n\u00E5v\u00E6rende oppsettet p\u00E5 skjermbildet ditt som din standardvisning <b>Min planleggingstavle</b>.<br>Hvis du trenger forskjellige oppsett for forskjellige oppgaver, kan du opprette flere visninger.<br>For \u00E5 gj\u00F8re flere endringer kan du tilpasse skjermbildet slik du \u00F8nsker, og deretter lagre til visningen som passer.<br>Hvis du vil at kollegaene dine skal kunne bruke en visning som du har opprettet, klikker du p\u00E5 Offentlig n\u00E5r du lagrer den.<br><br>Eksempler p\u00E5 innstillinger som du kan lagre i en visning\:<ul><li>Velg mellom \u00E5 vise bare ordrediagram, eller b\u00E5de ordre- og ressursdiagram.<li><li>Juster mellomrommet som hver enkelt kolonne har f\u00E5tt (dra kolonnesidene til den bredden du \u00F8nsker).</li><li>For de fleste kolonnene kan du ogs\u00E5 velge om du vil sortere kolonneverdiene i stigende eller synkende rekkef\u00F8lge.</li></ul></p>

