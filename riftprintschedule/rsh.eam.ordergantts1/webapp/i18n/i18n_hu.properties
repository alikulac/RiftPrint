#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>A rendszer mentette az aktu\u00E1lis elrendez\u00E9st a saj\u00E1t alap\u00E9rtelmezett n\u00E9zetek\u00E9nt\: <b>Saj\u00E1t tervt\u00E1bla</b>.<br>Amennyiben a k\u00FCl\u00F6nb\u00F6z\u0151 feladatokhoz k\u00FCl\u00F6nb\u00F6z\u0151 elrendez\u00E9sekre van sz\u00FCks\u00E9ge, lehet\u0151s\u00E9g van t\u00F6bb n\u00E9zet l\u00E9trehoz\u00E1s\u00E1ra.<br>Tov\u00E1bbi m\u00F3dos\u00EDt\u00E1sokat a k\u00E9perny\u0151 kiigaz\u00EDt\u00E1s\u00E1val tehet, majd mentse a megfelel\u0151 n\u00E9zetet.<br>Ha szeretn\u00E9, hogy koll\u00E9g\u00E1i is haszn\u00E1lhass\u00E1k az \u00D6n \u00E1ltal l\u00E9trehozott n\u00E9zetet, a ment\u00E9skor kattintson a \u201ENyilv\u00E1nos\u201D lehet\u0151s\u00E9gre.<br><br>P\u00E9lda a n\u00E9zetben t\u00E1rolhat\u00F3 be\u00E1ll\u00EDt\u00E1si lehet\u0151s\u00E9gekre\:<ul><li>Csak a rendel\u00E9sdiagram megjelen\u00EDt\u00E9se, vagy a rendel\u00E9s- \u00E9s az er\u0151forr\u00E1s-diagram megjelen\u00EDt\u00E9se.</li><li>Oszlopsz\u00E9less\u00E9gek kiigaz\u00EDt\u00E1sa (az oszlop sz\u00E9leinek kitol\u00E1sa a megfelel\u0151 sz\u00E9less\u00E9gig).</li><li>A legt\u00F6bb oszlop eset\u00E9n az oszlop \u00E9rt\u00E9kei n\u00F6vekv\u0151 vagy cs\u00F6kken\u0151 sorrendbe rendezhet\u0151k.</li></ul></p>

