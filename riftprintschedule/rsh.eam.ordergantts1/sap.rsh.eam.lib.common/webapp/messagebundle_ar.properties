WarningForDeleteWorkCenterFromFilter=\u0644\u0642\u062F \u0642\u0645\u062A \u0628\u0625\u0632\u0627\u0644\u0629 "{0}" \u0645\u0646 \u0642\u0627\u0626\u0645\u0629 \u0645\u0631\u0627\u0643\u0632 \u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u062E\u0627\u0635\u0629 \u0628\u0643. \u062A\u0645 \u062A\u0639\u062F\u064A\u0644 \u062C\u0645\u064A\u0639 \u0639\u0648\u0627\u0645\u0644 \u0627\u0644\u062A\u0635\u0641\u064A\u0629 \u0630\u0627\u062A \u0627\u0644\u0635\u0644\u0629. \u064A\u064F\u0631\u062C\u0649 \u062A\u062D\u062F\u064A\u062B \u0637\u0631\u0642 \u0627\u0644\u0639\u0631\u0636 \u0627\u0644\u062E\u0627\u0635\u0629 \u0628\u0643\u0645 \u0648\u0641\u0642\u0627 \u0644\u0630\u0644\u0643.

