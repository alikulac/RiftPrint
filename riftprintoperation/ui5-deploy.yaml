# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: riftprintoperation
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
customConfiguration:
  adp:
    support:
      id: '@sap/generator-adaptation-project'
      version: NO_VERSION_FOUND
      toolsId: 0354e937-7645-470e-b3e2-7ab4cf6ba4db
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DE5_RISE_BAS
          url: http://eldca-de5.sap.eldoradogold.com:8000          
        app:
          name: ZPM_RIFTPRIOPER
          package: ZPM
          transport: DE5K902178
        exclude:
          - /test/
          - /localService/
        lrep: apps/i2d.eam.orderandoperation.monitors1/appVariants/customer.riftprintoperation/
