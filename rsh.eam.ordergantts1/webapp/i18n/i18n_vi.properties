#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Ch\u00FAng t\u00F4i \u0111\u00E3 l\u01B0u b\u1ED1 c\u1EE5c hi\u1EC7n t\u1EA1i c\u1EE7a m\u00E0n h\u00ECnh ba\u0323n l\u00E0m m\u00E0n h\u00ECnh m\u1EB7c \u0111\u1ECBnh <b>Ba\u0309ng l\u00E2\u0323p li\u0323ch cu\u0309a t\u00F4i</b>.<br>N\u1EBFu b\u1EA1n c\u1EA7n b\u1ED1 c\u1EE5c kh\u00E1c nhau cho c\u00E1c ta\u0301c v\u1EE5 kh\u00E1c nhau, b\u1EA1n c\u00F3 th\u1EC3 t\u1EA1o nhi\u1EC1u ma\u0300n hi\u0300nh.<br>\u0110\u1EC3 th\u1EF1c hi\u1EC7n c\u00E1c thay \u0111\u1ED5i ti\u1EBFp theo, h\u00E3y \u0111i\u1EC1u ch\u1EC9nh m\u00E0n h\u00ECnh n\u1EBFu c\u1EA7n v\u00E0 sau \u0111\u00F3 l\u01B0u v\u00E0o ma\u0300n hi\u0300nh th\u00EDch h\u1EE3p.<br>N\u1EBFu b\u1EA1n mu\u1ED1n \u0111\u1ED3ng nghi\u1EC7p c\u1EE7a m\u00ECnh c\u00F3 th\u1EC3 s\u1EED d\u1EE5ng ma\u0300n hi\u0300nh b\u1EA1n \u0111\u00E3 t\u1EA1o, h\u00E3y nh\u1EA5p v\u00E0o \u2018C\u00F4ng khai\u2019 khi b\u1EA1n l\u01B0u.<br><br>V\u00ED d\u1EE5 v\u1EC1 nh\u01B0\u0303ng thi\u00EA\u0301t l\u00E2\u0323p m\u00E0 b\u1EA1n c\u00F3 th\u1EC3 l\u01B0u tr\u1EEF trong m\u00E0n h\u00ECnh\:<ul><li>Cho\u0323n gi\u01B0\u0303a chi\u0309 hi\u00EA\u0309n thi\u0323 bi\u00EA\u0309u \u0111\u00F4\u0300 \u0110\u01A1n ha\u0300ng ho\u0103\u0323c ca\u0309 bi\u00EA\u0309u \u0111\u00F4\u0300 \u0110\u01A1n ha\u0300ng va\u0300 Ta\u0300i nguy\u00EAn.</li><li>\u0110i\u1EC1u ch\u1EC9nh khoa\u0309ng tr\u00F4\u0301ng \u0111\u01B0\u1EE3c cung c\u1EA5p cho m\u1ED7i c\u1ED9t (K\u00E9o c\u1EA1nh c\u1EE7a c\u1ED9t \u0111\u1EBFn \u0111\u00F4\u0323 r\u1ED9ng m\u00E0 b\u1EA1n mu\u1ED1n).</li><li>\u0110\u1ED1i v\u1EDBi h\u1EA7u h\u1EBFt c\u00E1c c\u1ED9t, b\u1EA1n c\u0169ng c\u00F3 th\u1EC3 ch\u1ECDn xem b\u1EA1n mu\u1ED1n s\u1EAFp x\u1EBFp c\u00E1c gi\u00E1 tr\u1ECB c\u1ED9t theo th\u1EE9 t\u1EF1 t\u0103ng d\u1EA7n hay gi\u1EA3m d\u1EA7n.</li></ul></p>

