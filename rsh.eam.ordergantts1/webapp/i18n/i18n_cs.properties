#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>St\u00E1vaj\u00EDc\u00ED rozlo\u017Een\u00ED obrazovky se ulo\u017Eilo jako va\u0161e standardn\u00ED zobrazen\u00ED <br>M\u016Fj panel pl\u00E1nov\u00E1n\u00ED</b>.<br>Kdy\u017E budete pro jin\u00E9 \u00FAlohy pot\u0159ebovat jin\u00E1 rozlo\u017Een\u00ED, m\u016F\u017Eete vytvo\u0159it v\u00EDce zobrazen\u00ED.<br>Pokud chcete prov\u00E9st dal\u0161\u00ED zm\u011Bny, upravte obrazovku dle pot\u0159eby a pot\u00E9 ji ulo\u017Ete do vhodn\u00E9ho zobrazen\u00ED.</b>Pokud chcete, aby v\u00E1mi vytvo\u0159enou variantu mohli pou\u017E\u00EDvat i va\u0161i kolegov\u00E9, p\u0159i ukl\u00E1d\u00E1n\u00ED klikn\u011Bte na volbu Ve\u0159ejn\u00E9.<br><br>P\u0159\u00EDklady nastaven\u00ED, kter\u00E1 lze ulo\u017Eit v zobrazen\u00ED\:<ul><li>v\u00FDb\u011Br zobrazen\u00ED pouze grafu Zak\u00E1zky, nebo zobrazen\u00ED graf\u016F Zak\u00E1zky a Zdroje,</li><li>nastaven\u00ED \u0161\u00ED\u0159ky sloupce (rozta\u017Een\u00ED okraj\u016F sloupce).</li><li>U v\u011Bt\u0161iny sloupc\u016F lze zvolit vzestupn\u00E9 nebo sestupn\u011B \u0159azen\u00ED hodnot</li></ul></p>

