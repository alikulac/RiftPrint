#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Das aktuelle Layout Ihres Bilds wurde als Ihre Standardsicht <b>Meine Instandhaltungsplantafel</b> gesichert.<br>Wenn Sie f\u00FCr verschiedene Aufgaben verschiedene Layouts ben\u00F6tigen, k\u00F6nnen Sie mehrere Sichten anlegen.<br>Sie k\u00F6nnen weitere \u00C4nderungen vornehmen, indem Sie das Bild nach Bedarf anpassen und dann unter der entsprechenden Sicht sichern.<br>Wenn Ihre Kollegen eine von Ihnen angelegte Sicht verwenden sollen, w\u00E4hlen Sie beim Sichern "\u00D6ffentlich".<br><br>Beispiele f\u00FCr Einstellungen, die Sie in einer Sicht speichern k\u00F6nnen\:<ul><li>W\u00E4hlen Sie, ob Sie nur das Diagramm "Auftr\u00E4ge" anzeigen m\u00F6chten, oder die beiden Diagramme "Auftr\u00E4ge" und "Ressourcen".</li><li>Passen Sie den Platz f\u00FCr jede Spalte an (ziehen Sie die Seiten der Spalte auf die gew\u00FCnschte Breite).</li><li>F\u00FCr die meisten Spalten k\u00F6nnen Sie auch w\u00E4hlen, ob Sie die Spaltenwerte aufsteigend oder absteigend sortieren m\u00F6chten.</li></ul></p>

