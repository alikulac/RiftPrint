#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Zapisali\u015Bmy bie\u017C\u0105cy uk\u0142ad ekranu jako domy\u015Blny widok <b>M\u00F3j kokpit planowania</b>.<br>Je\u015Bli potrzebujesz innych uk\u0142ad\u00F3w dla r\u00F3\u017Cnych zada\u0144, mo\u017Cesz utworzy\u0107 wiele widok\u00F3w.<br>Aby wprowadzi\u0107 dodatkowe zmiany, dostosuj odpowiednio ekran, a nast\u0119pnie zapisz we w\u0142a\u015Bciwym widoku.<br>Je\u015Bli chcesz, aby Twoi wsp\u00F3\u0142pracownicy mogli korzysta\u0107 z utworzonego przez Ciebie widoku, kliknij opcj\u0119 'Publiczny', gdy go zapisujesz.<br><br>Przyk\u0142ady ustawie\u0144, kt\u00F3re mo\u017Cesz przechowywa\u0107 w widoku\:<ul><li>Wybierz opcj\u0119 wy\u015Bwietlania tylko wykresu Zlecenia lub zar\u00F3wno wykresu Zlecenia, jak i Zasoby.</li><li>Dostosuj przestrze\u0144 przydzielon\u0105 do poszczeg\u00F3lnych kolumn (przeci\u0105gnij kraw\u0119dzie kolumny do \u017C\u0105danej szeroko\u015Bci).</li><li>W przypadku wi\u0119kszo\u015Bci kolumn mo\u017Cesz r\u00F3wnie\u017C okre\u015Bli\u0107, czy chcesz posortowa\u0107 warto\u015Bci w kolumnie w kolejno\u015Bci rosn\u0105cej, czy malej\u0105cej.</li></ul></p>

