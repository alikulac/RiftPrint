#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Sa\u010Duvali smo trenutni izgled va\u0161eg ekrana kao standardni pogled <b>Moja tabla planiranja</b>.<br>Ako vam trebaju razli\u010Diti izgledi za razli\u010Dite zadatke, mo\u017Eete da kreirate vi\u0161estruke poglede.<br>Da biste izvr\u0161ili dodatne promene, prilagodite ekran po potrebi a zatim sa\u010Duvajte odgovaraju\u0107i pogled.<br><br>Ako \u017Eelite da va\u0161e kolege mogu da koriste pogled koji ste kreirali, kliknite na Javno kada je sa\u010Duvate.<br><br>Primeri pode\u0161avanja koja mo\u017Eete da sa\u010Duvate u pogledu\:<ul><li>Izaberite izme\u0111u prikazivanja samo dijagrama naloga ili dijagrama naloga i resursa.</li><li>Uskladite prostor dodeljen svakoj koloni (povucite strane kolone na \u0161irinu ko\u017Eu \u017Eelite).</li><li>Za ve\u0107inu kolona tako\u0111e mo\u017Eete da izaberete da li \u017Eelite da pore\u0111ate vrednosti kolone u rastu\u0107em ili opadaju\u0107em redosledu.</li></ul></p>

