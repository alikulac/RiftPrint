#YMSG: Information msg about switching from personalization to variant
SwitchFromPersonalizationToVariantInfoMsg=<p>Trenutno postavitev va\u0161ega ekrana smo shranili kot privzeti pogled.<b>Moja tabla za na\u010Drtovanje</b>.<br>\u010Ce potrebujete razli\u010Dne postavitve za razli\u010Dne naloge, lahko kreirate \u0161tevilne poglede.<br>\u010Ce \u017Eelite narediti nadaljnje spremembe, prilagodite ekran po potrebi in nato shranite v ustrezni pogled.<br>\u010Ce \u017Eelite svojim kolegom omogo\u010Diti uporabo pogleda, ki ste ga kreirali, med njegovim shranjevanjem kliknite Javno.<br><br>Primeri nastavitev, ki jih lahko shranite v pogledu\:<ul><li>Izberite med prikazom zgolj diagrama Nalogi ali diagramov Nalogi in Resursi.</li><li>Prilagodite prostor vsakega stolpca (povlecite stranice stolpca do \u017Eelene \u0161irine).</li><li>Za ve\u010Dino stolpcev lahko izberete tudi mo\u017Enost sortiranja vrednosti stolpca v nara\u0161\u010Dajo\u010Dem ali padajo\u010Dem vrstnem redu.</li></ul></p>

