# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: rsh.eam.ordergantts1
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: DE5_RISE_BAS
          url: http://vhegpde5ci.sap.eldoradogold.com:8000
          client: '010'
        app:
          name: RSH_EAM_ORDGTS1
          package: RSH_EAM_UI_ORD_GANTT
          description: Resource Scheduling in EAM - Resource GANTT
          transport: REPLACE_WITH_TRANSPORT
        exclude:
          - /test/
          - /localService/
